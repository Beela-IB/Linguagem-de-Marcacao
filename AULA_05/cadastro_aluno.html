<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Contrato</title>
</head>

<body>

    <h2>Cadastro de Contrato</h2>

    <form>

        <label for="codigo">Código:</label>
        <input type="text" id="codigo" name="codigo">

        <br><br>

        <label for="contrato">Nº do Contrato:</label>
        <input type="text" id="contrato" name="contrato">

        <label for="loja">Nº da Loja:</label>
        <input type="text" id="loja" name="loja">

        <br><br>

        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao" name="descricao" required>

        <br><br>

        <label for="data">Data:</label>
        <input type="date" id="data" name="data">

        <br><br>

        <label for="operadora">Operadora:</label>
        <select id="operadora" name="operadora">
            <option>Selecione</option>
            <option>Operadora 1</option>
            <option>Operadora 2</option>
        </select>

        <br><br>

        <label for="filial">Filial:</label>
        <select id="filial" name="filial">
            <option>Selecione</option>
            <option>Filial 1</option>
            <option>Filial 2</option>
        </select>

        <br><br>

        <label for="empresa">Empresa Matriz:</label>
        <select id="empresa" name="empresa">
            <option>Selecione</option>
            <option>Empresa 1</option>
            <option>Empresa 2</option>
        </select>

        <br><br>

        <label for="origem">Origem das Contas Contábeis:</label>
        <select id="origem" name="origem">
            <option>Contrato</option>
            <option>Cadastro</option>
        </select>

        <br><br>

        <label for="status">Status do Contrato:</label>
        <select id="status" name="status">
            <option>Ativo</option>
            <option>Inativo</option>
        </select>

        <br><br>

        <label for="comprovante">Identificar Comprovante por:</label>
        <select id="comprovante" name="comprovante">
            <option>Número Autorização</option>
            <option>Data</option>
        </select>

        <br><br>

        <input type="checkbox" id="deposito" name="deposito">
        <label for="deposito">Depósito na conta informada no arquivo</label>

        <br>

        <input type="checkbox" id="conciliacao" name="conciliacao">
        <label for="conciliacao">Conciliação consolidada</label>

        <br>

        <input type="checkbox" id="contas" name="contas">
        <label for="contas">Gerar Contas a Receber por Contrato</label>

        <br>

        <input type="checkbox" id="validar" name="validar">
        <label for="validar">Validar valores na conciliação automática</label>

        <br>

        <input type="checkbox" id="remover" name="remover">
        <label for="remover">Remover zeros à esquerda do Nº Comprovante</label>

        <br>

        <input type="checkbox" id="manual" name="manual">
        <label for="manual">Permitir conciliação manual</label>

        <br><br>

        <label for="cartao">Cartão:</label>
        <select id="cartao" name="cartao">
            <option>Não Informado</option>
            <option>Informado</option>
        </select>

        <br><br>

        <label for="pagamento">Forma de Pagamento:</label>
        <select id="pagamento" name="pagamento">
            <option>Não Informado</option>
            <option>Cartão</option>
            <option>Dinheiro</option>
            <option>Pix</option>
        </select>

        <h3>Contabilização</h3>

        <label for="provisao">Conta de Provisão:</label>
        <input type="text" id="provisao" name="provisao">

        <br><br>

        <label for="banco">Conta do Banco:</label>
        <input type="text" id="banco" name="banco">

        <br><br>

        <label for="comissao">Conta para Comissão:</label>
        <input type="text" id="comissao" name="comissao">

        <br><br>

        <label for="cancelamento">Conta para Cancelamento:</label>
        <input type="text" id="cancelamento" name="cancelamento">

        <br><br>

        <label for="antecipacao">Conta de Antecipação:</label>
        <input type="text" id="antecipacao" name="antecipacao">

        <br><br>

        <label for="ajusteDebito">Conta de Ajuste Débito:</label>
        <input type="text" id="ajusteDebito" name="ajusteDebito">

        <br><br>

        <label for="ajusteCredito">Conta de Ajuste a Crédito:</label>
        <input type="text" id="ajusteCredito" name="ajusteCredito">

        <br><br>

        <label for="aluguel">Conta de Despesas de Aluguel:</label>
        <input type="text" id="aluguel" name="aluguel">

        <br><br>

        <label for="compensacao">Conta de Compensação:</label>
        <input type="text" id="compensacao" name="compensacao">

        <br><br>

        <input type="submit" value="Inserir">
        <input type="reset" value="Cancelar">
        <button type="button">Log</button>

    </form>

</body>
</html>
