<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 1 - Tabela</title>
	</head>
	<body>
		<!-- table -> tabela-->
		<!-- Iniciando a tabela-->
		<table border="1" width="100%">
			<!-- thead -> table head -> cabeçalho da tabela -->
			<thead style="background-color: blue; color: #FFFFFF">
				<!-- Criando a primeira linha -->
				<!-- linha da tabela -> table row -> tr -->
				<tr>
					<!-- th -> table head -> cabeçalho -->
					<th>Disciplina</th>
					<th>Nota 1</th>
					<th>Nota 2</th>
					<th>Nota 3</th>
					<th>Nota 4</th>
					<th>Média</th>
				</tr>
			</thead>
			<!-- tbody -> table body -> corpo da tabela -->
			<tbody>
				<!-- Criando a segunda linha -->
				<!-- linha da tabela -> table row -> tr -->
				<tr>
					<!-- td -> table data -> dados da tabela -->
					<td>Matemática</td>
					<td>10,0</td>
					<td>9,0</td>
					<td>8,0</td>
					<td>7,0</td>
					<td>8,5</td>
				</tr>
				<!-- Criando a terceira linha -->
				
				<tr>
					<td>Português</td>
					<td>9,5</td>
					<td>10,0</td>
					<td>8,0</td>
					<td>8,5</td>
					<td>9,0</td>
				</tr>
				
				<tr>
					<!-- COLSPAN -> mesclar colunas -->
					<th colspan="6">SENAI</th>
				</tr>
				
				<tr>
					<th>Disciplina</th>
					<th colspan="2">1° Semestre</th>
					<th colspan="2">2° Semestre</th>
					<th>Média</th>
				</tr>
				
				<tr>
					<td>Lógica de Programação</td>
					<td>9,0</td>
					<td>9,0</td>
					<!-- ROWSPAN -> mesclar linhas -->
					<td rowspan="2">-</td>
					<td rowspan="2">-</td>
					<td>9,0</td>
				</tr>
				
				<tr>
					<td>Levantamento de Requisitos</td>
					<td>9,0</td>
					<td>8,0</td>
					<!-- Temos que apagar as linhas que serão mescladas -->
					<!-- <td>-</td> -->
					<!-- <td>-</td> -->
					<td>8,5</td>
				</tr>
				
				<tr>
					<td>Banco de Dados</td>
					<td>-</td>
					<td>-</td>
					<td>8,0</td>
					<td>10,0</td>
					<td>9,0</td>
				</tr>
			</tbody>
		</table>
	</body>
</html>
