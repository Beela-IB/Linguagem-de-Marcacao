<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Float</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h2>Float</h2>
    <p>Serve para mudar a posição do elemento na tela, seguindo seu ancestral mais próximo.</p>

    <ul>
        <li>Float: left; -> flutua para esquerda</li>
        <li>Float: right; -> flutua para direita</li>
        <li>Float: left; -> limpa os estilos anteriores</li>
    </ul>

    <br><br>

    <div>
        <h3>Float: left;</h3>
        <p class="esquerda">Um texto...</p>
        <img src="https://images.tcdn.com.br/img/img_prod/836117/machado_medieval_899542_pais_e_filhos_8747_1_40092aabc01fff07d53b633682902b5d.png">
    </div>

    <div>
        <h3>Float: right;</h3>
        <p class="direita">Um texto...</p>
        <img class="direita" src="https://images.tcdn.com.br/img/img_prod/836117/machado_medieval_899542_pais_e_filhos_8747_1_40092aabc01fff07d53b633682902b5d.png">
    </div>

    <p class="limpar">Um texto qualquer!</p>
</body>
</html>
